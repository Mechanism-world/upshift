name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      # `agents/` too: the adapted-agent backends are code the test suite imports and
      # runs, so a lint regression there is a lint regression in the evidence path.
      # `examples/` too: the reference runners and the shipped example agents are code a
      # user is told to copy, and tests/test_examples_runners.py executes them.
      - run: uv run ruff check src tests agents examples
      # Docker-backed shell_gpt sandbox tests self-skip when the image is absent (CI has no
      # sandbox image); everything else runs, offline, with zero API calls.
      - run: uv run pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      # Fails the job on any known vulnerability in the resolved dependency set.
      # --skip-editable skips upshift itself (an editable install pip-audit cannot resolve);
      # it does NOT suppress findings in any third-party package.
      - run: uv run --with pip-audit pip-audit --skip-editable

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check dist/*
      # The wheel must work as a tool install from a clean environment: init + sim demo.
      - run: |
          uv tool install dist/*.whl
          cd "$(mktemp -d)"
          upshift init demo-agent
          upshift upgrade --agent demo-agent --provider sim \
            --baseline-model sim-5.5 --candidate-model sim-5.6-sol --tag demo --quiet
