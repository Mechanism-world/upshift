<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="upshift — test whether a model upgrade breaks your agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="640" rx="28" fill="url(#grid)"/>
  <circle cx="330" cy="320" r="260" fill="url(#glow)"/>

  <!-- mark: a rounded tile with three ascending bars and a chevron = "shift up, verified" -->
  <g transform="translate(190,170)">
    <rect x="0" y="0" width="300" height="300" rx="64" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
    <rect x="62" y="186" width="42" height="54" rx="10" fill="url(#mark)" opacity="0.55"/>
    <rect x="129" y="146" width="42" height="94" rx="10" fill="url(#mark)" opacity="0.8"/>
    <rect x="196" y="98" width="42" height="142" rx="10" fill="url(#mark)"/>
    <path d="M 150 62 L 217 129 M 150 62 L 83 129" fill="none" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- check badge -->
    <circle cx="246" cy="60" r="34" fill="#16a34a"/>
    <path d="M 228 61 L 241 74 L 266 47" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="560" y="300" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="150" font-weight="800" fill="#f8fafc" letter-spacing="-6" textLength="470" lengthAdjust="spacingAndGlyphs">upshift</text>
  <text x="566" y="372" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="500" fill="#cbd5e1" textLength="960" lengthAdjust="spacingAndGlyphs">Test whether a model upgrade breaks your agent.</text>
  <text x="566" y="430" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="500" fill="#cbd5e1" textLength="900" lengthAdjust="spacingAndGlyphs">Then fix it — or prove you should stay pinned.</text>

  <!-- footer chips: textLength pins each label's rendered width so it fits its box in any font -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#94a3b8">
    <rect x="566" y="478" width="250" height="52" rx="26" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="691" y="512" text-anchor="middle" textLength="202" lengthAdjust="spacingAndGlyphs">OpenAI · Anthropic</text>
    <rect x="834" y="478" width="282" height="52" rx="26" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="975" y="512" text-anchor="middle" textLength="234" lengthAdjust="spacingAndGlyphs">runs on your machine</text>
    <rect x="1134" y="478" width="316" height="52" rx="26" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="1292" y="512" text-anchor="middle" textLength="268" lengthAdjust="spacingAndGlyphs">N reps · Fisher p · patch</text>
  </g>
  <text x="1410" y="600" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">by Mechanism.world</text>
</svg>
