[project]
name = "upshift"
version = "0.1.0"
description = "CLI that makes upgrading a production AI agent to a new model version safe"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0",
    "rich>=13",
]

[project.scripts]
upshift = "upshift.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
