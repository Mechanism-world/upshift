[project]
name = "upshift"
version = "0.1.0"
description = "CLI that makes upgrading a production AI agent to a new model version safe"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0",
    "rich>=13",
]

[project.scripts]
upshift = "upshift.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Everything under src/upshift ships in the wheel, including the `upshift init` template
# in src/upshift/example_agent/ (agent.json, system_prompt.txt, tools.json, backend.py,
# cases/cases.json). Keep it that way: init reads those files via importlib.resources.
packages = ["src/upshift"]
artifacts = ["src/upshift/example_agent/**"]

[tool.hatch.build.targets.sdist]
# runs/ is committed experiment evidence (megabytes of JSON transcripts), not package content.
exclude = ["/runs", "/dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
