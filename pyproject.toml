[project]
name = "upshift"
version = "0.2.1"
description = "Test whether a model upgrade breaks your AI agent, then fix it or prove you should stay pinned"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atila Vahedian" }]
requires-python = ">=3.12"
keywords = ["llm", "agents", "evaluation", "openai", "model-upgrade", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=1.3",
    "openai>=2.0",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/atilavahedian/upshift"
Repository = "https://github.com/atilavahedian/upshift"
Issues = "https://github.com/atilavahedian/upshift/issues"
Changelog = "https://github.com/atilavahedian/upshift/blob/main/CHANGELOG.md"

[project.scripts]
upshift = "upshift.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Everything under src/upshift ships in the wheel, including the `upshift init` template
# in src/upshift/example_agent/ (agent.json, system_prompt.txt, tools.json, backend.py,
# cases/cases.json). Keep it that way: init reads those files via importlib.resources.
packages = ["src/upshift"]
artifacts = ["src/upshift/example_agent/**"]

[tool.hatch.build.targets.sdist]
# runs/ is committed experiment evidence (megabytes of JSON transcripts), not package content.
exclude = ["/runs", "/dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
