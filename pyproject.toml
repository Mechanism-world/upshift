[project]
name = "upshift"
version = "0.5.0"
description = "Test whether a model upgrade breaks your AI agent, then fix it or prove you should stay pinned"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atila Vahedian" }]
requires-python = ">=3.12"
keywords = ["llm", "agents", "evaluation", "openai", "model-upgrade", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=1.3",
    "openai>=2.0",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/Mechanism-world/upshift"
Repository = "https://github.com/Mechanism-world/upshift"
Issues = "https://github.com/Mechanism-world/upshift/issues"
Changelog = "https://github.com/Mechanism-world/upshift/blob/main/CHANGELOG.md"

[project.scripts]
upshift = "upshift.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Everything under src/upshift ships in the wheel, including the `upshift init` template
# in src/upshift/example_agent/ (agent.json, system_prompt.txt, tools.json, backend.py,
# cases/cases.json). Keep it that way: init reads those files via importlib.resources.
packages = ["src/upshift"]
artifacts = ["src/upshift/example_agent/**"]

[tool.hatch.build.targets.sdist]
# runs/ is committed experiment evidence (megabytes of JSON transcripts), not package content.
# tests/ IS shipped so an sdist is testable. tests/rescue/fixtures/ is deliberately not
# excluded: it is ~12 KB of API request parameters (endpoint, model pair, params dict) with no
# upstream source text in it, and every incident's upstream license is recorded in
# tests/rescue/fixtures/LICENSES.md. Add an exclusion here if that ever stops being true.
exclude = ["/runs", "/dist", "/CLAUDE.md", "/agents", "/victim", "/reports", "/docs", "/.github", "/PRODUCT_RELIABILITY_UPGRADE.md", "/result.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# How a test gets its evidence. `live` is registered so a live test is *nameable*, but
# tests/rescue/conftest.py skips every `live`-marked test unless the run selects `-m live`:
# the default `pytest -q` must never reach a provider or spend money.
markers = [
    "sim: runs against the built-in deterministic simulator (no network, $0)",
    "mocked_transport: drives a scripted in-process provider or HTTP handler (no network)",
    "recorded_fixture: asserts against a committed capture/run record (no network)",
    "live: calls a real provider with real credentials; never selected by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"
